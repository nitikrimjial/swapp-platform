# Integration tests run against a real PostgreSQL database (never an in-memory substitute).
# Locally: create a database named swapp_test. In CI: a PostgreSQL service container (see .github/workflows/ci.yml).
spring:
  datasource:
    url: ${TEST_DB_URL:jdbc:postgresql://localhost:5432/swapp_test}
    username: ${TEST_DB_USERNAME:postgres}
    password: ${TEST_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 20

app:
  jwt:
    # Test-only key; production keys come from the JWT_SECRET environment variable.
    secret: test-only-signing-key-not-used-anywhere-else-0123456789
  security:
    bcrypt-strength: 4
  cors:
    allowed-origins: http://localhost:8080

logging:
  level:
    com.swapp: WARN
