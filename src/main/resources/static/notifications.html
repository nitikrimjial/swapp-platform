<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notifications · Swapp</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/css/app.css">
  <script src="/js/theme.js"></script>
  <script type="module" src="/js/pages/notifications.js"></script>
</head>
<body>
<main class="page" id="main">
  <div class="container" style="max-width:820px">
    <div class="page-head">
      <div><h1>Notifications</h1><p>Updates about your offers, exchanges and requests.</p></div>
      <div class="row">
        <div class="segmented" id="filter" role="tablist">
          <button class="active" data-unread="false">All</button>
          <button data-unread="true">Unread</button>
        </div>
        <button class="btn btn-secondary btn-sm" id="read-all">Mark all as read</button>
      </div>
    </div>
    <div class="card"><div class="notif-list" id="list"></div></div>
    <div class="row" style="justify-content:center;margin-top:18px"><button class="btn btn-secondary hidden" id="more">Load more</button></div>
  </div>
</main>
</body>
</html>
