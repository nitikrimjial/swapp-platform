<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Forgot password · Swapp</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/css/app.css">
  <script src="/js/theme.js"></script>
  <script type="module" src="/js/pages/account-recovery.js"></script>
</head>
<body data-mode="forgot">
<main class="page auth-main" id="main">
  <div class="auth-card">
    <h1>Forgot your password?</h1>
    <p class="lead">Enter the email you signed up with and we'll send you a link to choose a new password.</p>
    <div id="result"></div>
    <form id="recovery-form" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input class="input" id="email" name="email" type="email" autocomplete="email" required maxlength="255">
      </div>
      <button type="submit" class="btn btn-primary btn-lg btn-block" data-loading-text="Sending">Send reset link</button>
    </form>
    <p class="auth-switch">Remembered it? <a href="/login.html">Back to sign in</a></p>
  </div>
</main>
</body>
</html>
