<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Choose a new password · Swapp</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/css/app.css">
  <script src="/js/theme.js"></script>
  <script type="module" src="/js/pages/account-recovery.js"></script>
</head>
<body data-mode="reset">
<main class="page auth-main" id="main">
  <div class="auth-card">
    <h1>Choose a new password</h1>
    <p class="lead">You'll be signed out on every device, then you can sign in with your new password.</p>
    <div id="result"></div>
    <form id="recovery-form" novalidate>
      <div class="field">
        <label for="newPassword">New password</label>
        <input class="input" id="newPassword" name="newPassword" type="password" autocomplete="new-password" required minlength="8" maxlength="72">
        <span class="hint">At least 8 characters with a letter and a number.</span>
      </div>
      <div class="field">
        <label for="confirmPassword">Confirm new password</label>
        <input class="input" id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required maxlength="72">
      </div>
      <button type="submit" class="btn btn-primary btn-lg btn-block" data-loading-text="Saving">Save new password</button>
    </form>
    <p class="auth-switch"><a href="/forgot-password.html">Need a new link?</a></p>
  </div>
</main>
</body>
</html>
