spring:
  application:
    name: swapp
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/swapp}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
        default_batch_fetch_size: 50
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    # SMTP relay, used only when MAIL_PROVIDER=smtp (e.g. Brevo: smtp-relay.brevo.com, port 587).
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 32MB
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: ${PORT:8080}
  # "native" = Tomcat's RemoteIpValve: it trusts X-Forwarded-* only from internal proxy addresses and takes the client
  # address from the right of X-Forwarded-For, so clients cannot spoof their IP to dodge rate limits.
  forward-headers-strategy: native
  shutdown: graceful
  compression:
    enabled: true
  error:
    include-message: never
    include-stacktrace: never
    whitelabel:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    # An email outage must not mark the app unhealthy (Render would restart it for no benefit).
    mail:
      enabled: false

logging:
  level:
    com.swapp: INFO
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: ERROR

app:
  site:
    # Base URL for links in emails. On Render, RENDER_EXTERNAL_URL is set automatically.
    public-url: ${PUBLIC_URL:${RENDER_EXTERNAL_URL:http://localhost:8080}}
    # Shown on the Privacy Policy and in emails for privacy questions and grievances (DPDP Act 2023).
    contact-email: ${CONTACT_EMAIL:support@swapp.example}
  mail:
    # "log" writes emails to the application log (development); "smtp" delivers them.
    provider: ${MAIL_PROVIDER:log}
    from: ${MAIL_FROM:no-reply@swapp.example}
    from-name: Swapp
    # Turn on once SMTP works: unverified members then cannot post, offer, request, message or report.
    require-verification: ${REQUIRE_EMAIL_VERIFICATION:false}
    verification-ttl: P2D
    password-reset-ttl: PT1H
  jwt:
    # Leave blank in development to generate an ephemeral key. Required in production (min 32 bytes).
    secret: ${JWT_SECRET:}
    expiration: ${JWT_EXPIRATION:P7D}
  cookie:
    name: swapp_token
    secure: ${COOKIE_SECURE:false}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8080}
  security:
    bcrypt-strength: ${BCRYPT_STRENGTH:12}
    login-max-attempts: 10
    login-window: PT15M
  storage:
    # "database" (default, persists with PostgreSQL) or "filesystem" (requires a persistent volume)
    type: ${STORAGE_TYPE:database}
    local-dir: ${STORAGE_LOCAL_DIR:./data/uploads}
    max-image-bytes: 5242880
    max-images-per-item: 6
  limits:
    rate-limit-enabled: ${RATE_LIMIT_ENABLED:true}
    registrations-per-hour: 20        # per client address
    auth-attempts-per-minute: 15      # login + password change, per client address (bcrypt is CPU-heavy)
    writes-per-minute: 120            # POST/PUT/PATCH/DELETE per signed-in user
    email-requests-per-hour: 10       # password reset / verification emails, per client address and per account
    exports-per-hour: 5               # personal data downloads, per user
    max-active-listings-per-user: 100
    storage-per-user: ${STORAGE_PER_USER:30MB}   # photos across all of a user's listings
    storage-total: ${STORAGE_TOTAL:400MB}        # uploads pause before the database fills (Neon free = 0.5 GB)
    realtime-connections-per-user: 8
