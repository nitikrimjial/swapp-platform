spring:
  application:
    name: swapp
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/swapp}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
        default_batch_fetch_size: 50
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 32MB
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: ${PORT:8080}
  # "native" = Tomcat's RemoteIpValve: it trusts X-Forwarded-* only from internal proxy addresses and takes the client
  # address from the right of X-Forwarded-For, so clients cannot spoof their IP to dodge rate limits.
  forward-headers-strategy: native
  shutdown: graceful
  compression:
    enabled: true
  error:
    include-message: never
    include-stacktrace: never
    whitelabel:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  level:
    com.swapp: INFO
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: ERROR

app:
  jwt:
    # Leave blank in development to generate an ephemeral key. Required in production (min 32 bytes).
    secret: ${JWT_SECRET:}
    expiration: ${JWT_EXPIRATION:P7D}
  cookie:
    name: swapp_token
    secure: ${COOKIE_SECURE:false}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8080}
  security:
    bcrypt-strength: ${BCRYPT_STRENGTH:12}
    login-max-attempts: 10
    login-window: PT15M
  storage:
    # "database" (default, persists with PostgreSQL) or "filesystem" (requires a persistent volume)
    type: ${STORAGE_TYPE:database}
    local-dir: ${STORAGE_LOCAL_DIR:./data/uploads}
    max-image-bytes: 5242880
    max-images-per-item: 6
  limits:
    rate-limit-enabled: ${RATE_LIMIT_ENABLED:true}
    registrations-per-hour: 20        # per client address
    auth-attempts-per-minute: 15      # login + password change, per client address (bcrypt is CPU-heavy)
    writes-per-minute: 120            # POST/PUT/PATCH/DELETE per signed-in user
    max-active-listings-per-user: 100
    storage-per-user: ${STORAGE_PER_USER:30MB}   # photos across all of a user's listings
    storage-total: ${STORAGE_TOTAL:400MB}        # uploads pause before the database fills (Neon free = 0.5 GB)
    realtime-connections-per-user: 8
