spring:
  application:
    name: swapp
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/swapp?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
        default_batch_fetch_size: 50
        type.preferred_instant_jdbc_type: TIMESTAMP
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 32MB
  threads:
    virtual:
      enabled: true

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  shutdown: graceful
  compression:
    enabled: true
  error:
    include-message: never
    include-stacktrace: never
    whitelabel:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  level:
    com.swapp: INFO
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: ERROR
    org.hibernate.orm.incubating: ERROR

app:
  jwt:
    # Leave blank in development to generate an ephemeral key. Required in production (min 32 bytes).
    secret: ${JWT_SECRET:}
    expiration: ${JWT_EXPIRATION:P7D}
  cookie:
    name: swapp_token
    secure: ${COOKIE_SECURE:false}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8080}
  security:
    bcrypt-strength: ${BCRYPT_STRENGTH:12}
    login-max-attempts: 10
    login-window: PT15M
  storage:
    # "database" (default, persists with MySQL) or "filesystem" (requires a persistent volume)
    type: ${STORAGE_TYPE:database}
    local-dir: ${STORAGE_LOCAL_DIR:./data/uploads}
    max-image-bytes: 5242880
    max-images-per-item: 6
