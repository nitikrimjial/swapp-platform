spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

app:
  jwt:
    # No default: the application refuses to start in production without a secret.
    secret: ${JWT_SECRET}
  cookie:
    secure: ${COOKIE_SECURE:true}
  cors:
    # Same-origin requests never need CORS; this only matters for other front-ends. Render sets RENDER_EXTERNAL_URL.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:${RENDER_EXTERNAL_URL:http://localhost:8080}}

logging:
  level:
    root: INFO
    com.swapp: INFO
