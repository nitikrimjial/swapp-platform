# Render Blueprint: https://render.com/docs/blueprint-spec
# Deploys the Docker image as a free web service with HTTPS. PostgreSQL comes from Neon's free tier (no expiry).
services:
  - type: web
    name: swapp
    runtime: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JWT_SECRET
        generateValue: true          # Render generates a random 256-bit secret
      - key: DB_POOL_SIZE
        value: "5"                   # keep well under the free tier's connection limit
      - key: DB_URL
        sync: false                  # jdbc:postgresql://<neon-host>/<db>?sslmode=require
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
