# Render Blueprint: https://render.com/docs/blueprint-spec
# Deploys the Docker image as a free web service with HTTPS. PostgreSQL comes from Neon's free tier (no expiry).
services:
  - type: web
    name: swapp
    runtime: docker
    plan: free
    region: singapore              # keep next to the Neon database (AWS ap-southeast-1); the default is oregon
    autoDeploy: true
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JWT_SECRET
        generateValue: true          # Render generates a random 256-bit secret
      - key: DB_POOL_SIZE
        value: "5"                   # keep well under the free tier's connection limit
      - key: DB_URL
        sync: false                  # jdbc:postgresql://<neon-host>/<db>?sslmode=require
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      # --- Email (see docs/DEPLOYMENT.md "Email"). Until SMTP is set up, emails are only logged. ---
      - key: CONTACT_EMAIL
        sync: false                  # public privacy/grievance contact shown on the Privacy Policy
      - key: MAIL_PROVIDER
        value: log                   # change to smtp once the SMTP_* values below are filled in
      - key: MAIL_FROM
        sync: false                  # a sender address verified at the provider
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: REQUIRE_EMAIL_VERIFICATION
        value: "false"               # set to "true" after SMTP works
      # "Sign in with Google": OAuth client (Web application) from Google Cloud Console. Leave unset to hide the button.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
